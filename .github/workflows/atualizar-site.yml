name: Atualizar site com a planilha

# Roda sozinho quando uma planilha .xlsm/.xlsx é enviada ao repositório.
# Também pode ser disparado à mão em Actions → "Atualizar site com a planilha" → Run workflow.
on:
  push:
    branches: [main]
    paths: ['**.xlsm', '**.xlsx', '**.XLSM', '**.XLSX']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar leitor de Excel
        run: pip install openpyxl

      - name: Gerar o site a partir da planilha
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          TZ: America/Sao_Paulo
        run: python ferramentas/atualizar_site.py

      - name: Publicar o index.html atualizado
        run: |
          if git diff --quiet -- index.html; then
            echo "O site já estava igual; nada a publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza o site com a planilha enviada ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
          git push
